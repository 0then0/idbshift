version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # A historical experiment, not a floating runtime dependency. See docs/dependency-policy.md.
    ignore:
      - dependency-name: dexie
        update-types:
          [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
    groups:
      playwright:
        patterns: ["@playwright/*", "playwright", "playwright-core"]
        update-types: [minor, patch]
      toolchain:
        patterns: ["*"]
        exclude-patterns: ["dexie", "@playwright/*", "playwright", "playwright-core"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
